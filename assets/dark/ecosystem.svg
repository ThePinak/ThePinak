<svg viewBox="0 0 1000 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PINAK.SYS Architecture and Project Ecosystem">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .wire { stroke: #444444; stroke-width: 1; }
    .flow { stroke: #FFFFFF; stroke-width: 1.5; stroke-dasharray: 6 12; animation: flow 1.8s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
    .pop { opacity: 0; animation: pop .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .p0{animation-delay:.1s} .p1{animation-delay:.2s} .p2{animation-delay:.3s} .p3{animation-delay:.4s}
    .p4{animation-delay:.5s} .p5{animation-delay:.6s} .p6{animation-delay:.7s} .p7{animation-delay:.8s}
    .p8{animation-delay:.9s} .p9{animation-delay:1.0s} .p10{animation-delay:.15s}
    @keyframes pop { from{opacity:0;transform:scale(.97)} to{opacity:1;transform:scale(1)} }
    .node { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
    .nodeC { fill: #161B22; stroke: #58A6FF; stroke-width: 1.5; }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; stroke-dasharray: none; opacity: .4; }
      .pop { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <mask id="node-cutouts">
      <rect width="1000" height="680" fill="white"/>
      <rect x="405" y="252" width="190" height="56" fill="black"/>
      <rect x="75" y="138" width="180" height="54" fill="black"/>
      <rect x="30" y="268" width="180" height="54" fill="black"/>
      <rect x="85" y="398" width="180" height="54" fill="black"/>
      <rect x="300" y="76" width="180" height="54" fill="black"/>
      <rect x="545" y="83" width="180" height="54" fill="black"/>
      <rect x="755" y="148" width="180" height="54" fill="black"/>
      <rect x="760" y="283" width="180" height="54" fill="black"/>
      <rect x="270" y="448" width="180" height="54" fill="black"/>
      <rect x="630" y="403" width="180" height="54" fill="black"/>
      <rect x="100" y="554" width="180" height="54" fill="black"/>
      <rect x="410" y="535" width="180" height="54" fill="black"/>
      <rect x="720" y="554" width="180" height="54" fill="black"/>
    </mask>
  </defs>

  <line x1="48" y1="40" x2="952" y2="40" stroke="#333333"/>
  <text fill="#888888" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">SYSTEM ARCHITECTURE — INTERCONNECTED ENGINES</text>
  <text fill="#888888" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 01</text>

  <!-- Wires -->
  <g mask="url(#node-cutouts)">
    <line class="wire" x1="419" y1="252" x2="244" y2="192"/>
    <line class="wire" x1="405" y1="280" x2="210" y2="291"/>
    <line class="wire" x1="433" y1="308" x2="240" y2="398"/>
    <line class="wire" x1="483" y1="252" x2="407" y2="130"/>
    <line class="wire" x1="522" y1="252" x2="614" y2="137"/>
    <line class="wire" x1="595" y1="254" x2="755" y2="200"/>
    <line class="wire" x1="595" y1="291" x2="760" y2="300"/>
    <line class="wire" x1="479" y1="308" x2="380" y2="448"/>
    <line class="wire" x1="550" y1="308" x2="678" y2="403"/>
    <line class="wire" x1="471" y1="308" x2="218" y2="554"/>
    <line class="wire" x1="500" y1="308" x2="500" y2="535"/>
    <line class="wire" x1="529" y1="308" x2="782" y2="554"/>
  </g>
  <g mask="url(#node-cutouts)">
    <line class="flow" x1="419" y1="252" x2="244" y2="192"/>
    <line class="flow" x1="405" y1="280" x2="210" y2="291"/>
    <line class="flow" x1="433" y1="308" x2="240" y2="398"/>
    <line class="flow" x1="483" y1="252" x2="407" y2="130"/>
    <line class="flow" x1="522" y1="252" x2="614" y2="137"/>
    <line class="flow" x1="595" y1="254" x2="755" y2="200"/>
    <line class="flow" x1="595" y1="291" x2="760" y2="300"/>
    <line class="flow" x1="479" y1="308" x2="380" y2="448"/>
    <line class="flow" x1="550" y1="308" x2="678" y2="403"/>
    <line class="flow" x1="471" y1="308" x2="218" y2="554"/>
    <line class="flow" x1="500" y1="308" x2="500" y2="535"/>
    <line class="flow" x1="529" y1="308" x2="782" y2="554"/>
  </g>

  <!-- Cluster Labels -->
  <text fill="#CCCCCC" class="mono pop p10" x="165" y="118" font-size="10" letter-spacing="3" text-anchor="middle">DATABASE &amp; THEORY</text>
  <text fill="#CCCCCC" class="mono pop p10" x="512" y="60" font-size="10" letter-spacing="3" text-anchor="middle">CORE SYSTEMS &amp; OS</text>
  <text fill="#CCCCCC" class="mono pop p10" x="845" y="132" font-size="10" letter-spacing="3" text-anchor="middle">PRODUCTIVITY &amp; KANBAN</text>
  <text fill="#CCCCCC" class="mono pop p10" x="500" y="613" font-size="10" letter-spacing="3" text-anchor="middle">HACKATHONS &amp; APPLIED ML</text>

  <!-- Core Hub -->
  <g class="pop p0">
    <rect class="nodeC" x="405" y="252" width="190" height="56" rx="3"/>
    <text fill="#FFFFFF" class="mono" x="500" y="276" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">PINAK.SYS</text>
    <text fill="#888888" class="mono" x="500" y="294" font-size="8.5" letter-spacing="0.5" text-anchor="middle">core engineering architecture</text>
  </g>

  <!-- Nodes -->
  <g class="pop p1"><rect class="node" x="75" y="138" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="165" y="161" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">dbms-normalization</text><text fill="#888888" class="mono" x="165" y="180" font-size="9" letter-spacing="1" text-anchor="middle">1NF to BCNF · visual engine</text></g>
  <g class="pop p2"><rect class="node" x="30" y="268" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="120" y="291" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">daily-task-kanban</text><text fill="#888888" class="mono" x="120" y="310" font-size="9" letter-spacing="1" text-anchor="middle">workflow board · live sync</text></g>
  <g class="pop p3"><rect class="node" x="85" y="398" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="175" y="421" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">odoo-hackathon-2026</text><text fill="#888888" class="mono" x="175" y="440" font-size="9" letter-spacing="1" text-anchor="middle">hackathon platform · LDCE</text></g>
  <g class="pop p4"><rect class="node" x="300" y="76" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="390" y="99" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">pinak.os</text><text fill="#888888" class="mono" x="390" y="118" font-size="9" letter-spacing="1" text-anchor="middle">personal workspace &amp; data OS</text></g>
  <g class="pop p5"><rect class="node" x="545" y="83" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="635" y="106" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">bms-core</text><text fill="#888888" class="mono" x="635" y="125" font-size="9" letter-spacing="1" text-anchor="middle">management backend</text></g>
  <g class="pop p6"><rect class="node" x="755" y="148" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="845" y="171" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">trip-frontend</text><text fill="#888888" class="mono" x="845" y="190" font-size="9" letter-spacing="1" text-anchor="middle">interactive journey explorer</text></g>
  <g class="pop p7"><rect class="node" x="760" y="283" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="850" y="306" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">telemetry-engine</text><text fill="#888888" class="mono" x="850" y="325" font-size="9" letter-spacing="1" text-anchor="middle">automated stats &amp; CI/CD</text></g>
  <g class="pop p8"><rect class="node" x="270" y="448" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="360" y="471" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">ml-pipeline</text><text fill="#888888" class="mono" x="360" y="490" font-size="9" letter-spacing="1" text-anchor="middle">applied machine learning</text></g>
  <g class="pop p9"><rect class="node" x="630" y="403" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="720" y="426" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">distributed-auth</text><text fill="#888888" class="mono" x="720" y="445" font-size="9" letter-spacing="1" text-anchor="middle">JWT · RBAC · APIs</text></g>

  <!-- Bottom cluster -->
  <g class="pop p7"><rect class="node" x="100" y="554" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="190" y="577" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">system-design</text><text fill="#888888" class="mono" x="190" y="596" font-size="9" letter-spacing="1" text-anchor="middle">caching &amp; indexing</text></g>
  <g class="pop p8"><rect class="node" x="410" y="535" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="500" y="558" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">api-gateway</text><text fill="#888888" class="mono" x="500" y="577" font-size="9" letter-spacing="1" text-anchor="middle">RESTful microservices</text></g>
  <g class="pop p9"><rect class="node" x="720" y="554" width="180" height="54" rx="2"/><text fill="#FFFFFF" class="mono" x="810" y="577" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">open-source</text><text fill="#888888" class="mono" x="810" y="596" font-size="9" letter-spacing="1" text-anchor="middle">community &amp; tooling</text></g>

  <line x1="48" y1="640" x2="952" y2="640" stroke="#333333"/>
  <text fill="#666666" class="mono" x="952" y="662" font-size="10" letter-spacing="2" text-anchor="end">DASHED LINES — ACTIVE TELEMETRY &amp; DATA FLOW</text>
</svg>