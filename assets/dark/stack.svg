<svg viewBox="0 0 1000 238" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical Stack - Languages, Backend, Frontend, Data, ML, Tooling">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.6s} .a6{animation-delay:.7s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="148" y1="8" x2="148" y2="230" stroke="#333333" stroke-width="1"/>

  <text class="mono rise a1" x="48" y="32"  font-size="12" fill="#888888" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="164" y="32"  font-size="15" fill="#FFFFFF">JavaScript (ES6+) · TypeScript · Python · SQL · HTML5 / CSS3</text>

  <text class="mono rise a2" x="48" y="64"  font-size="12" fill="#888888" letter-spacing="2">BACKEND</text>
  <text class="mono rise a2" x="164" y="64"  font-size="15" fill="#FFFFFF">Node.js · Express.js · RESTful APIs · JWT Auth · Microservices</text>

  <text class="mono rise a3" x="48" y="96"  font-size="12" fill="#888888" letter-spacing="2">FRONTEND</text>
  <text class="mono rise a3" x="164" y="96"  font-size="15" fill="#FFFFFF">React.js · Next.js · Tailwind CSS · Vanilla CSS · Responsive Design</text>

  <text class="mono rise a4" x="48" y="128" font-size="12" fill="#888888" letter-spacing="2">DATABASES</text>
  <text class="mono rise a4" x="164" y="128" font-size="15" fill="#FFFFFF">PostgreSQL · MongoDB · Schema Normalization (1NF-BCNF) · Redis</text>

  <text class="mono rise a5" x="48" y="160" font-size="12" fill="#888888" letter-spacing="2">AI &amp; ML</text>
  <text class="mono rise a5" x="164" y="160" font-size="15" fill="#FFFFFF">Machine Learning Pipelines · Data Preprocessing · Model Evaluation</text>

  <text class="mono rise a6" x="48" y="192" font-size="12" fill="#888888" letter-spacing="2">DEV &amp; OPS</text>
  <text class="mono rise a6" x="164" y="192" font-size="15" fill="#FFFFFF">Git · GitHub Actions CI/CD · Docker · Linux / Shell Scripting</text>

  <text class="mono rise a7" x="48" y="224" font-size="12" fill="#888888" letter-spacing="2">TOOLING</text>
  <text class="mono rise a7" x="164" y="224" font-size="15" fill="#FFFFFF">VS Code · Postman · Vercel · NPM · Vite · JSONB</text>
</svg>