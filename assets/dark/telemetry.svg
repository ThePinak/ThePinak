<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer Telemetry: Language Distribution, Shipping Velocity, Profile Counters">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{transform-origin:48px 0;animation-delay:.3s}.g2{transform-origin:48px 0;animation-delay:.45s}.g3{transform-origin:48px 0;animation-delay:.6s}
    .g4{transform-origin:48px 0;animation-delay:.75s}.g5{transform-origin:48px 0;animation-delay:.9s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}.d5{animation-delay:2.2s}
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.5s}.n2{animation-delay:.7s}.n3{animation-delay:.9s}.n4{animation-delay:1.1s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 622px 112px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .bar,.spark,.dot,.rise,.ping { animation: none; }
      .bar{transform:scaleX(1)} .spark{stroke-dashoffset:0} .dot,.rise{opacity:1} .ping{opacity:0}
    }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="#333333"/>
  <text fill="#888888" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">DEVELOPER TELEMETRY — VELOCITY &amp; CODEBASE METRICS</text>
  <text fill="#888888" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 02</text>
  <line x1="360" y1="64" x2="360" y2="296" stroke="#333333" opacity=".4"/>
  <line x1="688" y1="64" x2="688" y2="296" stroke="#333333" opacity=".4"/>

  <!-- Language Bars -->
  <text fill="#666666" class="mono" x="48" y="78" font-size="10" letter-spacing="2.5">PRIMARY LANGUAGES · EST.</text>
  <g class="mono" font-size="11">
    <text fill="#FFFFFF" x="48" y="108">javascript</text>   <rect class="bar g1" x="48" y="116" width="220" height="6" fill="#DDDDDD"/><text fill="#888888" x="278" y="123" font-size="10">54%</text>
    <text fill="#FFFFFF" x="48" y="146">typescript</text>   <rect class="bar g2" x="48" y="154" width="180" height="6" fill="#FFFFFF"/><text fill="#888888" x="238" y="161" font-size="10">22%</text>
    <text fill="#FFFFFF" x="48" y="184">python</text>       <rect class="bar g3" x="48" y="192" width="120" height="6" fill="#FFFFFF"/><text fill="#888888" x="178" y="199" font-size="10">14%</text>
    <text fill="#FFFFFF" x="48" y="222">sql / postgres</text><rect class="bar g4" x="48" y="230" width="80"  height="6" fill="#FFFFFF"/><text fill="#888888" x="138" y="237" font-size="10">6%</text>
    <text fill="#FFFFFF" x="48" y="260">html / css</text>   <rect class="bar g5" x="48" y="268" width="60"  height="6" fill="#FFFFFF"/><text fill="#888888" x="118" y="275" font-size="10">4%</text>
  </g>

  <!-- Velocity Chart -->
  <text fill="#666666" class="mono" x="392" y="78" font-size="10" letter-spacing="2.5">SHIPPING VELOCITY · 2024 → 2026</text>
  <g>
    <line x1="392" y1="252" x2="656" y2="252" stroke="#333333"/>
    <polyline class="spark" points="392,240 445,225 500,195 560,150 622,112 656,92" stroke="#DDDDDD" stroke-width="1.5" fill="none"/>
    <circle class="dot d1" cx="445" cy="225" r="2.5" fill="#FFFFFF"/>
    <circle class="dot d2" cx="500" cy="195" r="2.5" fill="#FFFFFF"/>
    <circle class="dot d3" cx="560" cy="150" r="2.5" fill="#FFFFFF"/>
    <circle class="ping" cx="622" cy="112" r="4" stroke="#DDDDDD" fill="none"/>
    <circle class="dot d4" cx="622" cy="112" r="3" fill="#DDDDDD"/>
    <text fill="#666666" class="mono" x="392" y="272" font-size="9.5" letter-spacing="1.5">'24</text>
    <text fill="#666666" class="mono" x="524" y="272" font-size="9.5" letter-spacing="1.5">'25</text>
    <text fill="#666666" class="mono" x="640" y="272" font-size="9.5" letter-spacing="1.5">'26</text>
    <text fill="#888888" class="mono dot d5" x="392" y="300" font-size="10" letter-spacing="1.5">trajectory — <tspan fill="#DDDDDD" font-weight="700">accelerating velocity</tspan></text>
  </g>

  <!-- Profile Counters -->
  <g>
    <g class="rise n1"><text fill="#FFFFFF" class="mono" x="720" y="118" font-size="44" font-weight="700">09</text><text fill="#888888" class="mono" x="790" y="112" font-size="10" letter-spacing="2.5">ORIGINAL REPOSITORIES</text></g>
    <g class="rise n2"><text fill="#FFFFFF" class="mono" x="720" y="178" font-size="44" font-weight="700">20</text><text fill="#888888" class="mono" x="790" y="172" font-size="10" letter-spacing="2.5">FOLLOWERS &amp; NETWORK</text></g>
    <g class="rise n3"><text fill="#FFFFFF" class="mono" x="720" y="238" font-size="44" font-weight="700">03</text><text fill="#888888" class="mono" x="790" y="232" font-size="10" letter-spacing="2.5">ACTIVE PRODUCTION DEPLOYS</text></g>
    <g class="rise n4"><text fill="#DDDDDD" class="mono" x="718" y="298" font-size="44" font-weight="700">∞</text><text fill="#888888" class="mono" x="790" y="292" font-size="10" letter-spacing="2.5">LINES OF CODE EXECUTED</text></g>
  </g>
</svg>