<svg viewBox="0 0 1000 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Statistics &amp; Language Architecture">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #000000; }
    .panel { fill: none; stroke: #000000; stroke-width: 1; }
    .rule { stroke: #000000; stroke-width: 1; }
    .bar { fill: none; stroke: #000000; stroke-width: 1; }
    .fill { fill: #000000; }
    .grow { transform: scaleX(0); transform-origin: left; animation: grow .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .g2{animation-delay:.1s}.g3{animation-delay:.2s}.g4{animation-delay:.3s}.g5{animation-delay:.4s}
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .grow { animation: none; transform: scaleX(1); } }
  </style>
  <rect class="panel" x="24" y="20" width="456" height="270" rx="2"/>
  <rect class="panel" x="520" y="20" width="456" height="270" rx="2"/>

  <g class="mono">
    <text x="52" y="58" font-size="14" font-weight="700" letter-spacing="2">GITHUB TELEMETRY</text>
    <line class="rule" x1="52" y1="72" x2="452" y2="72"/>
    <text x="52" y="110" font-size="11" letter-spacing="1">PUBLIC REPOSITORIES</text><text x="436" y="110" font-size="13" font-weight="600" text-anchor="end">9</text>
    <text x="52" y="146" font-size="11" letter-spacing="1">TOTAL STARS EARNED</text><text x="436" y="146" font-size="13" font-weight="600" text-anchor="end">3</text>
    <text x="52" y="182" font-size="11" letter-spacing="1">TOTAL RECENT COMMITS</text><text x="436" y="182" font-size="13" font-weight="600" text-anchor="end">24+</text>
    <text x="52" y="218" font-size="11" letter-spacing="1">COMMUNITY FOLLOWERS</text><text x="436" y="218" font-size="13" font-weight="600" text-anchor="end">25</text>
    <text x="52" y="254" font-size="11" letter-spacing="1">SYSTEM UPTIME / SYNC</text><text x="436" y="254" font-size="13" font-weight="600" text-anchor="end">ONLINE</text>

    <text x="548" y="58" font-size="14" font-weight="700" letter-spacing="2">ECOSYSTEM COMPOSITION</text>
    <line class="rule" x1="548" y1="72" x2="948" y2="72"/>
    <text x="548" y="105" font-size="10">JAVASCRIPT</text><rect class="bar" x="660" y="94" width="270" height="12"/><rect class="fill grow" x="660" y="94" width="235" height="12"/>
    <text x="548" y="141" font-size="10">TYPESCRIPT</text><rect class="bar" x="660" y="130" width="270" height="12"/><rect class="fill grow g2" x="660" y="130" width="35" height="12"/>
    <text x="548" y="177" font-size="10">PYTHON / ML</text><rect class="bar" x="660" y="166" width="270" height="12"/><rect class="fill grow g3" x="660" y="166" width="25" height="12"/>
    <text x="548" y="213" font-size="10">DATABASES &amp; SQL</text><rect class="bar" x="660" y="202" width="270" height="12"/><rect class="fill grow g4" x="660" y="202" width="20" height="12"/>
    <text x="548" y="249" font-size="10">HTML / CSS / SHELL</text><rect class="bar" x="660" y="238" width="270" height="12"/><rect class="fill grow g5" x="660" y="238" width="15" height="12"/>
  </g>
</svg>