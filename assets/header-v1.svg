<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pinak Thummar - Always curious">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s} .a4{animation-delay:1.2s} .a5{animation-delay:1.4s} .a6{animation-delay:1.7s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade { animation: none; }
      .draw{stroke-dashoffset:0} .rise,.fade{opacity:1}
    }
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="#CCCCCC" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="#666666" x="48" y="44" font-size="11" letter-spacing="3.5">ENGINEERING INDEX Nº 001</text>
    <text class="mono" fill="#666666" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">GUJARAT, IN — 21.17° N</text>
  </g>

  <g class="rise a2">
    <text fill="#111111" class="mono" x="46" y="176" font-size="72" letter-spacing="-2" font-weight="600">Pinak Thummar</text>
  </g>
  <g class="fade a3">
    <text fill="#666666" class="mono" x="48" y="214" font-size="19">Always curious</text>
  </g>

  <g class="fade a4">
    <text fill="#888888" class="mono" x="48" y="274" font-size="12.5" letter-spacing="1">focus  →</text>
    <text fill="#222222" class="mono" x="128" y="274" font-size="12.5" letter-spacing="1">backend systems · machine learning · full-stack apps</text>
  </g>
  <g class="fade a5">
    <text fill="#888888" class="mono" x="48" y="300" font-size="12.5" letter-spacing="1">motto  →</text>
    <text fill="#222222" class="mono" x="128" y="300" font-size="12.5" letter-spacing="1">"Intelligence thrives in isolation, innovation thrives in collaboration"</text>
  </g>

  <line class="draw a5" x1="48" y1="342" x2="952" y2="342" stroke="#CCCCCC" stroke-width="1"/>
  <g class="fade a6">
    <text fill="#666666" class="mono" x="48" y="374" font-size="11.5" letter-spacing="3">BACKEND &amp; DISTRIBUTED</text>
    <text fill="#222222" class="mono" x="290" y="374" font-size="11.5">·</text>
    <text fill="#666666" class="mono" x="315" y="374" font-size="11.5" letter-spacing="3">MACHINE LEARNING</text>
    <text fill="#666666" class="mono" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">SYS.THEPINAK — 2026</text>
  </g>
</svg>