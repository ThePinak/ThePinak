<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development Timeline: 2024 to 2026 and beyond">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke: #CCCCCC; stroke-width: 1; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:.9s}.m3{animation-delay:.1.4s}.m4{animation-delay:1.8s}.m5{animation-delay:2.2s}.m6{animation-delay:2.6s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 1040px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0}
    }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="#CCCCCC"/>
  <text fill="#555555" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">THE ROUTE SO FAR — ENGINEERING MILESTONES</text>
  <text fill="#555555" class="mono" x="1152" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 03</text>

  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>

  <g class="m m1">
    <circle cx="100" cy="125" r="4" fill="#111111"/>
    <line x1="100" y1="121" x2="100" y2="96" stroke="#CCCCCC"/>
    <text fill="#222222" class="mono" x="100" y="74" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">2024</text>
    <text fill="#111111" class="mono" x="100" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">first open-source commit</text>
  </g>

  <g class="m m2">
    <circle cx="340" cy="125" r="4" fill="#111111"/>
    <line x1="340" y1="129" x2="340" y2="154" stroke="#CCCCCC"/>
    <text fill="#222222" class="mono" x="340" y="172" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">2025</text>
    <text fill="#111111" class="mono" x="340" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Trip Frontend &amp; DBMS Normalizer</text>
  </g>

  <g class="m m3">
    <circle cx="580" cy="125" r="4" fill="#111111"/>
    <line x1="580" y1="121" x2="580" y2="96" stroke="#CCCCCC"/>
    <text fill="#222222" class="mono" x="580" y="74" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">FEB 2026</text>
    <text fill="#111111" class="mono" x="580" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Daily Task Manager Kanban</text>
  </g>

  <g class="m m4">
    <circle cx="810" cy="125" r="4" fill="#111111"/>
    <line x1="810" y1="129" x2="810" y2="154" stroke="#CCCCCC"/>
    <text fill="#222222" class="mono" x="810" y="172" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">AUG 2026</text>
    <text fill="#111111" class="mono" x="810" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Odoo x LDCE Hackathon 2026</text>
  </g>

  <g class="m m5">
    <circle class="ring" cx="1040" cy="125" r="4" stroke="#222222" fill="none"/>
    <circle class="pulse" cx="1040" cy="125" r="4.5" fill="#222222"/>
    <line x1="1040" y1="121" x2="1040" y2="96" stroke="#CCCCCC"/>
    <text fill="#222222" class="mono" x="1040" y="74" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">NOW</text>
    <text fill="#111111" class="mono" x="1040" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">PINAK.OS &amp; Backend Mastery</text>
  </g>

  <g class="m m6">
    <circle cx="1152" cy="125" r="3" fill="#777777"/>
    <text fill="#777777" class="mono" x="1152" y="105" font-size="10" letter-spacing="2" text-anchor="end">FUTURE →</text>
    <text fill="#777777" class="mono" x="1152" y="150" font-size="12" text-anchor="end">Distributed Scale</text>
  </g>
</svg>