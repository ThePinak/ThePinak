<svg viewBox="0 0 1000 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami - bio, focus, trajectory, status">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <text class="mono rise a1" x="48" y="32" font-size="16" fill="#111111">software engineer exploring scalable backend systems, database internals &amp; machine learning.</text>
  <text class="mono rise a2" x="48" y="60" font-size="16" fill="#111111">building robust architectures — Node.js · TypeScript · PostgreSQL · Python · Distributed Tooling.</text>
  <text class="mono rise a3" x="48" y="88" font-size="15" fill="#555555">"taking my ideas from 'kind of' to 'one of a kind'" — engineering with precision, speed &amp; depth.</text>

  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="#E0E0E0" stroke-width="1"/>

  <text class="mono rise a4" x="48"  y="148" font-size="11" fill="#555555" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="154" y="148" font-size="15" fill="#111111">Distributed Systems · Backend Engineering · Applied Machine Learning · Automation</text>

  <text class="mono rise a5" x="48"  y="182" font-size="11" fill="#555555" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="154" y="182" font-size="15" fill="#222222">actively building · open to high-impact software engineering roles &amp; collaboration</text>

  <text class="mono rise a6" x="48"  y="216" font-size="11" fill="#555555" letter-spacing="2.5">MISSION</text>
  <text class="mono rise a6" x="154" y="216" font-size="15" fill="#111111">BETTER THAN YESTERDAY — continuous learning, shipping &amp; architecture mastery</text>
</svg>